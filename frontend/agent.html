<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayerPortal — Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/agent.css" />
  </head>
  <body>
    <nav>
      <div class="nb">
        <div class="ni">📦</div>
        <span class="nt">PayerPortal</span>
      </div>
      <div class="nr">
        <div class="tabs">
          <button class="tb active" onclick="showTab('form', this)">
            New Order
          </button>
          <button
            class="tb"
            onclick="
              showTab('orders', this);
              loadOrders();
            "
          >
            My Orders
          </button>
        </div>
        <span class="nu">Agent: <strong id="agn">—</strong></span>
        <button class="btn-sm bg" onclick="logout()">Sign Out</button>
      </div>
    </nav>
    <div class="alert" id="fa"></div>
    <main>
      <div id="form-section">
        <div class="ph">
          <h1>Submit New Order</h1>
          <p>
            Fill all required fields. Confirmation email is sent automatically
            on submit.
          </p>
        </div>
        <div class="card">
          <p class="st">Customer Details</p>
          <div class="g2">
            <div class="fg">
              <label>First Name <span class="req">*</span></label
              ><input id="first_name" /><span
                class="fe"
                id="e-first_name"
              ></span>
            </div>
            <div class="fg">
              <label>Last Name <span class="req">*</span></label
              ><input id="last_name" /><span class="fe" id="e-last_name"></span>
            </div>
            <div class="fg cs2">
              <label>Street Address <span class="req">*</span></label
              ><input id="street_address" /><span
                class="fe"
                id="e-street_address"
              ></span>
            </div>
            <div class="fg">
              <label>City <span class="req">*</span></label
              ><input id="city" /><span class="fe" id="e-city"></span>
            </div>
            <div class="fg">
              <label>State <span class="req">*</span></label
              ><input id="state" /><span class="fe" id="e-state"></span>
            </div>
            <div class="fg">
              <label>Pincode <span class="req">*</span></label
              ><input id="pincode" /><span class="fe" id="e-pincode"></span>
            </div>
            <div class="fg">
              <label>Country <span class="req">*</span></label
              ><input id="country" value="USA" /><span
                class="fe"
                id="e-country"
              ></span>
            </div>
            <div class="fg">
              <label>Phone <span class="req">*</span></label
              ><input id="phone" type="tel" /><span
                class="fe"
                id="e-phone"
              ></span>
            </div>
            <div class="fg">
              <label>Email <span class="req">*</span></label
              ><input id="email" type="email" /><span
                class="fe"
                id="e-email"
              ></span>
            </div>
          </div>

          <div class="dv"></div>
          <p class="st">
            Medicine Items
            <span
              style="
                color: var(--accent);
                font-size: 11px;
                text-transform: none;
                letter-spacing: 0;
                font-weight: 400;
              "
              >(add one or more)</span
            >
          </p>
          <div class="il" id="il"></div>
          <button class="bai" onclick="addItem()">+ Add Medicine</button>
          <span
            class="fe"
            id="e-items"
            style="display: block; margin-top: 6px"
          ></span>

          <div class="dv"></div>
          <div class="g2">
            <div class="fg">
              <label>Lead Source <span class="req">*</span></label>
              <select id="lead_source" onchange="onSourceChange()">
                <option value="">— Select Source —</option>
                <option value="Truemed">Truemed</option>
                <option value="Mcland">Mcland</option>
                <option value="Syncore">Syncore</option>
                <option value="Tradewave">Tradewave</option>
                <option value="Other">Other</option>
              </select>
              <span class="fe" id="e-lead_source"></span>
              <span
                id="ehint"
                style="font-size: 12px; color: var(--accent); display: none"
                >📧 Email will be sent from this source's inbox</span
              >
            </div>
            <div class="fg">
              <label>Payment Mode <span class="req">*</span></label>
              <select id="payment_mode" onchange="onPaymentModeChange()">
                <option value="">— Select Payment Mode —</option>
                <option value="Zelle">Zelle</option>
                <option value="Cash app">Cash app</option>
                <option value="Venmo">Venmo</option>
                <option value="Bitcoin">Bitcoin</option>
                <option value="Apple pay">Apple pay</option>
                <option value="Card Payment">Card Payment</option>
                <option value="Pending">Pending</option>
                <option value="Other">Other</option>
              </select>
              <span class="fe" id="e-payment_mode"></span>
              <input
                id="payment_mode_other"
                placeholder="Enter custom payment mode"
                style="display: none; margin-top: 6px"
              />
            </div>
            <div class="fg">
              <label>Order Info <span class="req">*</span></label>
              <select id="order_info" onchange="onOrderInfoChange()">
                <option value="">— Select Order Info —</option>
                <option value="Re-order">Re-order</option>
                <option value="New">New</option>
                <option value="Repeat">Repeat</option>
              </select>
              <span class="fe" id="e-order_info"></span>
              <input
                id="order_info_other"
                placeholder="Enter custom order info"
                style="display: none; margin-top: 6px"
              />
            </div>
	            <div class="fg cs2">
	              <label
	                >Notes
	                <span style="color: var(--muted); font-weight: 400"
                  >(optional)</span
                ></label
              ><input id="notes" placeholder="Any notes…" />
            </div>
          </div>

          <div class="dv"></div>
          <div style="display: flex; gap: 12px; align-items: center">
            <button class="bs" id="sbtn" onclick="submitOrder()">
              Submit Order
            </button>
            <button class="btn-sm bg" onclick="reset()">Clear</button>
          </div>
        </div>
      </div>
      <div id="orders-section" style="display: none">
	    <div class="ph"><h1>My Orders</h1><p>Orders waiting for tracking ID.</p></div>
    <div class="card"><div id="oc"><div class="es"><div class="ic">⏳</div><p>Loading…</p></div></div></div>
      </div>
    </main>
    <script>
      const API = window.location.origin + "/api";
      const token = localStorage.getItem("pp_token");
      const user = JSON.parse(localStorage.getItem("pp_user") || "null");
      if (!token || !user || user.role !== "agent") {
        window.location.href = "index.html";
      }
      document.getElementById("agn").textContent = user.name;

      const MEDICINES_FALLBACK = [
        { name: "Clonazepam-Rivotril Usa To Usa 2Mg" },
        { name: "Diazepam-Dizepam-10 Usa To Usa 10MG" },
        { name: "Armodafinil Usa To Usa 150MG" },
        { name: "Zolpidem Belbien Usa To Usa 10MG" },
        { name: "Diazepam-Elipam Usa To Usa 10MG" },
        { name: "Eszopiclone Usa To Usa 3MG" },
        { name: "Gabapentin Usa To Usa 800MG" },
        { name: "Lorazepam-Hemofarm Usa To Usa 2.5MG" },
        { name: "Alprazolam-Kaslol Usa To Usa 1MG" },
        { name: "Levitra Usa To Usa 20MG" },
        { name: "Lorazepam-Ativan Usa To Usa 2MG" },
        { name: "Modafinil USA to USA 200MG" },
        { name: "Diazepam-Bensidine Usa To Usa 10MG" },
        { name: "Lorazepam-Nerodelm Usa To Usa 2MG" },
        { name: "Clonazepam-Nozim USA to USA 2MG" },
        { name: "Pregabalin Usa To Usa 300MG" },
        { name: "Tramadol-Royal Usa To Usa 225MG" },
        { name: "Soma USA to USA 350MG" },
        { name: "Tapentadol USA to USA 100MG" },
        { name: "Tramadol-Trakem Usa To Usa 100MG" },
        { name: "Viagra USA to USA" },
        { name: "Tramadol-OLTRAM Usa To Usa 100MG" },
        { name: "Xanax Bars White USA to USA 2MG" },
        { name: "Zolpidem-Zoltrate Usa To Usa 10MG" },
        { name: "Zopiclone USA to USA 10MG" },
        { name: "Xanax Bars Green USA to USA 2MG" },
        { name: "Cialis USA to USA 20MG" },
        { name: "Alprazolam-Rlam USA to USA 1MG" },
      ];

      let MEDICINES = MEDICINES_FALLBACK;
      (async function loadMedicines() {
        try {
          const r = await fetch("./data/medicines.json");
          if (r.ok) {
            const d = await r.json();
            if (Array.isArray(d)) MEDICINES = d;
          }
        } catch (e) {}
      })();

	      async function loadOrders() {
	        const oc = document.getElementById("oc");
	        oc.innerHTML =
	          '<div class="es"><div class="ic">⏳</div><p>Loading…</p></div>';
        try {
          const res = await fetch(`${API}/orders/mine`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error);
          if (!data.orders.length) {
            oc.innerHTML =
              '<div class="es"><div class="ic">📋</div><p>No orders pending tracking.</p></div>';
            return;
          }

          const rows = data.orders
            .map((o) => {
              const items = (o.items || [])
                .map(
                  (i) =>
                    `<div class="ip">• ${i.product_name} — ${i.quantity}×${i.mg} @ ₹${parseFloat(i.cost).toFixed(2)}</div>`,
                )
                .join("");
              const total = (o.items || []).reduce(
                (s, i) => s + parseFloat(i.cost) * i.quantity,
                0,
              );
              return `<tr>
        <td><strong style="font-size:12px">${o.order_id}</strong><br/><span style="font-size:11px;color:var(--muted)">${new Date(o.order_date).toLocaleDateString()}</span></td>
        <td>${o.first_name} ${o.last_name}<br/><span style="font-size:11px;color:var(--muted)">${o.phone}</span></td>
        <td>${items}<div style="font-size:12px;font-weight:600;margin-top:4px">Total: ₹${total.toFixed(2)}</div></td>
        <td style="font-size:12px">${o.lead_source}</td>
        <td><span class="bdg ${o.order_status}">${o.order_status}</span></td>
        <td>${o.tracking_id ? `<code style="font-size:11px">${o.tracking_id}</code>` : `<button class="te" onclick="updTrack('${o.order_id}',this)">+ Add</button>`}</td>
      </tr>`;
            })
            .join("");
          oc.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-bottom:14px"><strong style="color:var(--text)">${data.pagination.total}</strong> order(s)</div>
      <div class="tw"><table>
        <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Source</th><th>Status</th><th>Tracking</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>`;
        } catch (e) {
          oc.innerHTML = `<div class="es"><p style="color:var(--error)">Error: ${e.message}</p></div>`;
        }
	      }

	      async function updTrack(orderId, el) {
	        if (!orderId || !el) return;
	        const td = el.closest ? el.closest("td") : null;
	        if (!td) return;

	        const prev = td.innerHTML;
	        td.innerHTML = `
	          <div style="display:flex;gap:8px;align-items:center">
	            <input id="trk_${orderId}" placeholder="Enter tracking ID" style="max-width:180px;padding:8px 10px;font-size:12px" />
	            <button class="te" onclick="saveTrack('${orderId}', this)">Save</button>
	            <button class="te" style="opacity:.7" onclick="cancelTrack(this)">Cancel</button>
	          </div>
	        `;
	        td.dataset.prev = prev;
	        setTimeout(() => {
	          const i = document.getElementById(`trk_${orderId}`);
	          if (i) i.focus();
	        }, 0);
	      }

	      function cancelTrack(btn) {
	        const td = btn && btn.closest ? btn.closest("td") : null;
	        if (!td) return;
	        td.innerHTML = td.dataset.prev || "";
	        delete td.dataset.prev;
	      }

	      async function saveTrack(orderId, btn) {
	        const td = btn && btn.closest ? btn.closest("td") : null;
	        const inp = document.getElementById(`trk_${orderId}`);
	        const tracking_id = inp ? inp.value.trim() : "";
	        if (!td) return;
	        if (!tracking_id) {
	          showAlert("Tracking ID is required.", "error");
	          return;
	        }

	        btn.disabled = true;
	        btn.textContent = "Saving...";
	        try {
	          const res = await fetch(`${API}/orders/${orderId}/tracking`, {
	            method: "PUT",
	            headers: {
	              "Content-Type": "application/json",
	              Authorization: `Bearer ${token}`,
	            },
	            body: JSON.stringify({ tracking_id }),
	          });
	          const data = await res.json();
	          if (!res.ok) {
	            const msg =
	              (data && data.error) ||
	              (data && data.errors && data.errors[0] && data.errors[0].msg) ||
	              "Failed to update tracking.";
	            throw new Error(msg);
	          }

	          const tr = td.closest ? td.closest("tr") : null;
	          if (tr) tr.remove();
	          const tbody = document.querySelector("#oc table tbody");
	          if (!tbody || !tbody.children.length) loadOrders();
	        } catch (e) {
	          btn.disabled = false;
	          btn.textContent = "Save";
	          showAlert(e.message || "Failed to update tracking.", "error");
	        }
	      }

	      function showTab(t, btn) {
        document
          .querySelectorAll(".tb")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("form-section").style.display =
          t === "form" ? "block" : "none";
        document.getElementById("orders-section").style.display =
          t === "orders" ? "block" : "none";
      }

      function logout() {
        localStorage.clear();
        window.location.href = "index.html";
      }
      function onSourceChange() {
        const v = document.getElementById("lead_source").value;
        document.getElementById("ehint").style.display = v ? "block" : "none";
      }
      function onPaymentModeChange() {
        const v = document.getElementById("payment_mode").value;
        document.getElementById("payment_mode_other").style.display =
          v === "Other" ? "block" : "none";
      }
      function onOrderInfoChange() {
        const v = document.getElementById("order_info").value;
        document.getElementById("order_info_other").style.display =
          v === "Other" ? "block" : "none";
      }

      let ic = 0;
      function addItem(d = {}) {
        ic++;
        const n = ic;
        const div = document.createElement("div");
        div.className = "mi";
        div.id = "mi" + n;
        div.innerHTML = `
  <div class="ig">
    <div class="fg" style="position:relative">
      <label>Product Name<span class="req">*</span></label>
      <input class="ip" placeholder="Search medicine..." value="${d.product_name || ""}" oninput="showSuggestions(this, ${n})" autocomplete="off"/>
      <div class="suggestions" id="sug${n}"></div>
    </div>
    <div class="fg"><label>Qty<span class="req">*</span></label><input class="iq" type="number" placeholder="1" min="1" value="${d.quantity || ""}"/></div>
    <div class="fg"><label>MG<span class="req">*</span></label><input class="im" placeholder="500mg" value="${d.mg || ""}"/></div>
    <div class="fg"><label>Cost $<span class="req">*</span></label><input class="ic" type="number" placeholder="0.00" min="0" step="0.01" value="${d.cost || ""}" oninput="updateTotal(${n})"/></div>
    <button class="ri" onclick="removeItem(${n})" title="Remove">×</button>
  </div><div class="itotal" id="it${n}"></div>`;
        document.getElementById("il").appendChild(div);
      }

      function showSuggestions(input, n) {
        const val = input.value.toLowerCase();
        const container = document.getElementById("sug" + n);
        container.innerHTML = "";
        if (!val) return;

        const matches = MEDICINES.filter((m) =>
          m.name.toLowerCase().includes(val),
        );
        if (matches.length === 0) return;

        matches.forEach((m) => {
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.textContent = m.name;
          div.onclick = () => {
            input.value = m.name;
            // Only update the product name input, do not touch MG or other fields
            container.innerHTML = "";
          };
          container.appendChild(div);
        });
      }

      document.addEventListener("click", (e) => {
        if (!e.target.classList.contains("ip")) {
          document
            .querySelectorAll(".suggestions")
            .forEach((s) => (s.innerHTML = ""));
        }
      });

      function removeItem(n) {
        const el = document.getElementById("mi" + n);
        if (el) el.remove();
        if (!document.querySelectorAll(".mi").length) addItem();
      }
      function updateTotal(n) {
        const el = document.getElementById("mi" + n);
        if (!el) return;
        const c = parseFloat(el.querySelector(".ic").value) || 0;
        const t = document.getElementById("it" + n);
        t.textContent = c > 0 ? `Line total: $${c.toFixed(2)}` : "";
      }
      function getItems() {
        return Array.from(document.querySelectorAll(".mi")).map((el) => ({
          product_name: el.querySelector(".ip").value.trim(),
          quantity: parseInt(el.querySelector(".iq").value) || 0,
          mg: el.querySelector(".im").value.trim(),
          cost: parseFloat(el.querySelector(".ic").value) || 0,
        }));
      }

      function showAlert(msg, type) {
        const el = document.getElementById("fa");
        el.innerHTML = msg;
        const t = type === "success" || type === "error" ? type : "success";
        el.classList.remove("success", "error");
        el.classList.add("alert", t, "show");
        clearTimeout(window.__ppAlertTimer);
        window.__ppAlertTimer = setTimeout(() => {
          el.classList.remove("show");
        }, 4500);
      }
      function clearErrs() {
        document.querySelectorAll(".fe").forEach((e) => {
          e.classList.remove("show");
          e.textContent = "";
        });
        document
          .querySelectorAll(".ef")
          .forEach((e) => e.classList.remove("ef"));
      }
      function fErr(id, msg) {
        const el = document.getElementById("e-" + id);
        if (el) {
          el.textContent = msg;
          el.classList.add("show");
        }
        const inp = document.getElementById(id);
        if (inp) inp.classList.add("ef");
      }
      function reset() {
	        [
	          "first_name",
	          "last_name",
	          "street_address",
	          "city",
	          "state",
	          "pincode",
	          "country",
	          "phone",
	          "email",
	          "notes",
	        ].forEach((id) => {
	          const el = document.getElementById(id);
	          if (el) el.value = id === "country" ? "India" : "";
	        });
        document.getElementById("lead_source").value = "";
        document.getElementById("payment_mode").value = "";
        document.getElementById("payment_mode_other").value = "";
        document.getElementById("payment_mode_other").style.display = "none";
        document.getElementById("il").innerHTML = "";
        ic = 0;
        addItem();
        clearErrs();
        document.getElementById("ehint").style.display = "none";
      }

      async function submitOrder() {
        clearErrs();
        document.getElementById("fa").classList.remove("show");
        const f = {
          first_name: document.getElementById("first_name").value.trim(),
          last_name: document.getElementById("last_name").value.trim(),
          street_address: document
            .getElementById("street_address")
            .value.trim(),
          city: document.getElementById("city").value.trim(),
          state: document.getElementById("state").value.trim(),
          pincode: document.getElementById("pincode").value.trim(),
          country: document.getElementById("country").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim(),
          lead_source: document.getElementById("lead_source").value,
          payment_mode:
            document.getElementById("payment_mode").value === "Other"
              ? document.getElementById("payment_mode_other").value.trim()
              : document.getElementById("payment_mode").value,
	          order_info:
	            document.getElementById("order_info").value === "Other"
	              ? document.getElementById("order_info_other").value.trim()
	              : document.getElementById("order_info").value,
	          notes: document.getElementById("notes").value.trim(),
	          items: getItems(),
	        };

        let err = false;
        [
          "first_name",
          "last_name",
          "street_address",
          "city",
          "state",
          "pincode",
          "country",
          "phone",
          "lead_source",
          "payment_mode",
          "order_info",
        ].forEach((k) => {
          if (!f[k]) {
            fErr(k, "Required");
            err = true;
          }
        });
        if (!f.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) {
          fErr("email", "Valid email required");
          err = true;
        }
        const itemErr =
          f.items.length === 0 ||
          f.items.some(
            (i) =>
              !i.product_name ||
              !i.mg ||
              i.quantity < 1 ||
              isNaN(i.cost) ||
              i.cost < 0,
          );
        if (itemErr) {
          const el = document.getElementById("e-items");
          el.textContent = "Fill all medicine fields for each item";
          el.classList.add("show");
          err = true;
        }
        if (err) return;

        const btn = document.getElementById("sbtn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spin"></span>Submitting…';
        try {
          const res = await fetch(`${API}/orders`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(f),
          });
          const data = await res.json();
          if (!res.ok) {
            if (data.errors)
              data.errors.forEach((e) => fErr(e.path || "items", e.msg));
            throw new Error(data.error || "Failed");
          }
          showAlert(
            `✅ Order <strong>${data.order.order_id}</strong> submitted with ${f.items.length} item(s). Confirmation email queued.`,
            "success",
          );
          reset();
        } catch (e) {
          showAlert("❌ " + e.message, "error");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Submit Order";
        }
      }
      addItem();
    </script>
  </body>
</html>
